# JDK usado por el daemon de Gradle. En esta máquina no hay `java` en el PATH, y
# la raíz del keg de Homebrew (/opt/homebrew/opt/openjdk) es sólo una carpeta de
# symlinks sin `release` ni `lib/`, así que no sirve como JAVA_HOME: hay que
# apuntar al home real del JDK.
org.gradle.java.home=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home

# OJO: esta propiedad sólo elige el JVM del daemon. El script `./gradlew` en sí
# necesita encontrar un `java` para arrancar, así que hay que exportar:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
